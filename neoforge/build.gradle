plugins {
    id 'net.neoforged.moddev' version '2.0.147'
    id "com.matthewprenger.cursegradle" version "1.4.0"
}

base.archivesName.set("${mod_name}-neoforge")

def resources = project(':Common').file('src/generated/resources/').getAbsolutePath()

neoForge {
    version = neoforge_version
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg').absolutePath)

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("run/client"))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file("run/data"))
            // DataGen can be run by - "./gradlew :NeoForge:runData" in Terminal.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', resources, '--existing', resources
        }
        server {
            server()
            gameDirectory = this.mkdir(this.file("run/server"))
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":Common")
    implementation 'com.github.glitchfiend:GlitchCore-neoforge:' + minecraft_version + '-' + glitchcore_version
    implementation "com.github.glitchfiend:SereneSeasons-neoforge:${minecraft_version}-${serene_seasons_version}"
}

tasks.named("compileJava", JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

tasks.withType(Javadoc).configureEach {
    source(project(":Common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":Common").sourceSets.main.allSource)
}

test {
    failOnNoDiscoveredTests = false
}

processResources {
    from project(":Common").sourceSets.main.resources
    filesMatching("${mod_id}.mixins.json") {
        expand "refmap_target": "${mod_id}."
    }
}

curseforge {
    apiKey = project.findProperty('curseApiKey') ?: 'unset'
    project {
        id = mod_curseforge_id

        if (changelog_file.exists()) {
            changelog = changelog_file
        }

        releaseType = release_channel
        addGameVersion minecraft_version
        addGameVersion name
        addGameVersion 'Client'
        addGameVersion 'Server'

        mainArtifact(jar) {
            displayName = "${mod_display_name} ${name} ${version}"
        }

        relations {
            requiredDependency 'glitchcore'
            requiredDependency 'terrablender-neoforge'
        }
    }
}
