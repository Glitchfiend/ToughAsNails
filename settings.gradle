if (providers.gradleProperty("neoforgeOnly").isPresent()) {
    include("common", "neoforge")
} else if (providers.gradleProperty("noForge").isPresent()) {
    include("common", "neoforge", "fabric")
} else {
    include("common", "forge", "neoforge", "fabric")
}

pluginManagement.repositories {
    gradlePluginPortal()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "NeoForge"
        url = "https://maven.neoforged.net/releases"
    }
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
    maven {
        name = "Sponge Snapshots"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
}

rootProject.name = "ToughAsNails"

// We want lowercase folder names but uppercase project names
project(":common").name = "Common"
project(":neoforge").name = "NeoForge"
if (!providers.gradleProperty("neoforgeOnly").isPresent()) {
    if (!providers.gradleProperty("noForge").isPresent()) {
        project(":forge").name = "Forge"
    }
    project(":fabric").name = "Fabric"
}
