pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "NeoForge"
            url = "https://maven.neoforged.net/releases"
        }
        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "Sponge Snapshots"
            url = "https://repo.spongepowered.org/repository/maven-public/"
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Forge/NeoForge are excluded here: this port only targets Fabric (26.2), and their
// forge_version/neoforge_version haven't been bumped to match, which would break
// dependency resolution if those subprojects were evaluated.
include("common", "fabric")

rootProject.name = "ToughAsNails"

// We want lowercase folder names but uppercase project names
project(":common").name = "Common"
project(":fabric").name = "Fabric"
